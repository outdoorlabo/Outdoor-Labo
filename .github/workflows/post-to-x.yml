name: Post new articles to X

on:
  push:
    branches:
      - main
    paths:
      - "content/posts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not post)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install tweepy pyyaml

      - name: Collect target posts
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest=$(git -c core.quotepath=false log -1 --name-only --pretty=format: --diff-filter=A -- 'content/posts/*.md' | grep -m1 '\.md$' || true)
            echo "files=$latest" >> "$GITHUB_OUTPUT"
            echo "args=--force" >> "$GITHUB_OUTPUT"
          else
            files=$(git -c core.quotepath=false diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.event.after }}" -- 'content/posts/*.md' | tr '\n' ' ')
            echo "files=$files" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to X
        if: steps.targets.outputs.files != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          extra="${{ steps.targets.outputs.args }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            extra="$extra --dry-run"
          fi
          python3 scripts/post_to_x.py $extra ${{ steps.targets.outputs.files }}
