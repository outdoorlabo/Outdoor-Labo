# Pages CMS configuration for OUTDOOR LABO
# Articles remain Hugo-compatible Markdown files in content/posts.

media:
  - name: post-images
    label: 記事画像
    input: static/wp-content/uploads
    output: /wp-content/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

content:
  - name: categories
    label: カテゴリー管理
    type: collection
    path: content/category
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}/_index.md"
      field: false
    view:
      primary: title
      fields: [title, slug]
    fields:
      - name: title
        label: カテゴリー名
        type: string
        required: true
      - name: slug
        label: URLスラッグ（英数字）
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

  - name: tags
    label: タグ管理
    type: collection
    path: content/tag
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}/_index.md"
      field: false
    view:
      primary: title
      fields: [title, slug]
    fields:
      - name: title
        label: タグ名
        type: string
        required: true
      - name: slug
        label: URLスラッグ（英数字）
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

  - name: posts
    label: 記事
    type: collection
    path: content/posts
    format: yaml-frontmatter
    # slug フィールドの値をファイル名に使用。Hugo の URL にも同じ slug を使う。
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      fields: [title, date, draft, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 投稿日
        type: date
        required: true
      - name: slug
        label: URLスラッグ（英数字）
        type: string
        required: true
      - name: draft
        label: 下書き
        type: boolean
        default: true
      - name: description
        label: 記事の概要
        type: text
      - name: image
        label: アイキャッチ画像
        type: image
        options:
          media: post-images
      - name: category
        label: カテゴリー
        type: reference
        options:
          collection: categories
          multiple: true
          search: "title,fields.slug"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: tag
        label: タグ
        type: reference
        options:
          collection: tags
          multiple: true
          search: "title,fields.slug"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: body
        label: 本文
        type: rich-text
        options:
          media: post-images
          switcher: true

actions:
  - name: migrate-taxonomy-slugs
    label: カテゴリー・タグを一括移行
    workflow: migrate-taxonomy-slugs.yml
    ref: current
    confirm:
      title: 分類データを移行しますか？
      message: 既存のカテゴリー94件・タグ922件の各ファイルに、フォルダ名と同じslug項目を追加します。記事の分類値やURLは変更しません。
      button: 一括移行を実行

settings:
  content:
    merge: true
  commit:
    templates:
      create: "記事を作成: {path}"
      update: "記事を更新: {path}"
      delete: "記事を削除: {path}"
      rename: "記事名を変更: {oldPath} -> {newPath}"
