description = "屋外＋道具＋α"
logo = "/images/ol-header.png"        # static/images/ に置く(WordPressの ol-header.png)
footerLogo = "/images/ol.png"         # 同 cropped-ol.png
webfont = true                         # Noto Sans JP を Google Fonts から読み込む
headingNumbers = true                  # 記事内 h2 に「1.」「2.」を自動で付ける(WP と同じ見た目)
breadcrumb = false                     # パンくずを出すか
authorBox = false                      # 記事末尾のプロフィール欄
relatedPosts = true                    # 関連記事
amazonNotice = "OUTDOOR LABOは、Amazonアソシエイト・プログラムの参加者です。"
instagramUser = "outdoorlabo"

