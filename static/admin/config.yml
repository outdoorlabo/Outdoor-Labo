backend:
  name: github
  repo: outdoorlabo/Outdoor-Labo
  branch: test/oauth-preview-origin-allowlist
  base_url: https://outdoorlabo-decap-auth-preview.outdoorlabo.workers.dev
  auth_endpoint: /auth

site_url: https://test-oauth-preview-origin-al.outdoorlabo.pages.dev
display_url: https://test-oauth-preview-origin-al.outdoorlabo.pages.dev
publish_mode: editorial_workflow

# New uploads are staged here. A GitHub Action sorts them by the save commit's JST date.
media_folder: static/wp-content/uploads
public_folder: /wp-content/uploads

media_library:
  name: outdoor-labo-folder-library

collections:
  - name: categories
    label: カテゴリー
    folder: content/category
    create: true
    delete: true
    nested:
      depth: 1
      subfolders: true
    meta:
      path:
        label: URLスラッグ
        widget: string
        index_file: _index
    fields:
      - label: 名前
        name: title
        widget: string
      - label: 説明
        name: body
        widget: markdown
        required: false

  - name: tags
    label: タグ
    folder: content/tag
    create: true
    delete: true
    nested:
      depth: 1
      subfolders: true
    meta:
      path:
        label: URLスラッグ
        widget: string
        index_file: _index
    fields:
      - label: 名前
        name: title
        widget: string
      - label: 説明
        name: body
        widget: markdown
        required: false

  - name: posts
    label: 記事
    label_singular: 記事
    folder: content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields:
      - field: date
        label: 公開日時
        default_sort: desc
      - title
    view_groups:
      - label: 公開年
        field: date
        pattern: "\\d{4}"
    media_folder: static/wp-content/uploads/_incoming
    public_folder: /wp-content/uploads/_incoming
    fields:
      - label: タイトル
        name: title
        widget: string
      - label: 公開日時
        name: date
        widget: datetime
        required: true
      - label: 最終更新日時
        name: lastmod
        widget: datetime
        required: false
      - label: URLスラッグ
        name: slug
        widget: string
        hint: "既存記事のURLを変えないよう、通常は変更しないでください。新規記事では英数字とハイフンを推奨します。"
      - label: カテゴリー
        name: category
        widget: relation
        collection: categories
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        multiple: true
        required: false
        options_length: 30
        hint: "入力すると登録済みカテゴリーの候補が表示されます。"
      - label: タグ
        name: tag
        widget: relation
        collection: tags
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        multiple: true
        required: false
        options_length: 30
        hint: "入力すると登録済みタグの候補が表示されます。"
      - label: アイキャッチ画像
        name: image
        widget: image
        required: false
      - label: 概要文
        name: description
        widget: text
        required: false
      - label: WordPress ID（移行データ）
        name: wpid
        widget: number
        required: false
      - label: 本文
        name: body
        widget: markdown
