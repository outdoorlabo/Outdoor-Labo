# Pages CMS configuration for OUTDOOR LABO
# Articles remain Hugo-compatible Markdown files in content/posts.

media:
  - name: post-images
    label: 記事画像
    input: static/wp-content/uploads
    output: /wp-content/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

content:
  - name: posts
    label: 記事
    type: collection
    path: content/posts
    format: yaml-frontmatter
    # ファイル名は作成時刻で自動生成。Hugo の :slug にもそのまま使う。
    # 日付は date フィールドから URL に反映するため、ここでは時刻だけを使う。
    filename:
      template: "{hour}{minute}{second}.md"
      field: false
    view:
      fields: [title, date, draft, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 投稿日
        type: date
        required: true
      - name: draft
        label: 下書き
        type: boolean
        default: true
      - name: description
        label: 記事の概要
        type: text
      - name: image
        label: アイキャッチ画像
        type: image
        options:
          media: post-images
      - name: category
        label: カテゴリー
        type: string
        list: true
      - name: tag
        label: タグ
        type: string
        list: true
      - name: body
        label: 本文
        type: rich-text

settings:
  content:
    merge: true
  commit:
    templates:
      create: "記事を作成: {path}"
      update: "記事を更新: {path}"
      delete: "記事を削除: {path}"
      rename: "記事名を変更: {oldPath} -> {newPath}"
