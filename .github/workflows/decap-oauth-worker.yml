name: Decap OAuth Worker

on:
  pull_request:
    paths:
      - "oauth-worker/**"
      - ".github/workflows/decap-oauth-worker.yml"
  push:
    branches:
      - main
    paths:
      - "oauth-worker/**"
      - ".github/workflows/decap-oauth-worker.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oauth-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
