name: Migrate Hugo taxonomy slugs

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: taxonomy-slug-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Add explicit slugs to Hugo taxonomy pages
        run: python3 scripts/migrate-taxonomy-slugs.py

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No taxonomy files need migration."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/category content/tag
          git commit -m "Add explicit slugs to taxonomy pages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
