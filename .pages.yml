# Pages CMS configuration for OUTDOOR LABO
# Hugo taxonomy URLs and existing article slugs are preserved.

media:
  - name: post-images
    label: 記事画像
    input: static/wp-content/uploads
    output: /wp-content/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

content:
  # The writing workflow is the primary CMS task: keep it first.
  - name: posts
    label: 記事
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      fields: [title, date, draft, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 投稿日
        type: date
        required: true
      - name: slug
        label: URLスラッグ（英数字）
        type: string
        required: true
        description: 既存記事のURLを維持するため、公開済み記事では変更しないでください。
      - name: draft
        label: 下書き
        type: boolean
        default: true
      - name: description
        label: 記事の概要
        type: text
      - name: image
        label: アイキャッチ画像
        type: image
        options:
          media: post-images
      - name: category
        label: カテゴリー
        type: reference
        options:
          collection: category-options
          multiple: true
          search: "title,fields.hierarchy,fields.slug"
          value: "{fields.slug}"
          label: "{fields.hierarchy}"
      - name: tag
        label: タグ
        type: reference
        options:
          collection: tag-options
          multiple: true
          search: "title,fields.slug"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: body
        label: 本文
        type: rich-text
        options:
          media: post-images
          switcher: true

  - name: categories
    label: カテゴリー管理
    type: collection
    path: content/category
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}/_index.md"
      field: false
    view:
      primary: title
      fields: [title, parent, slug]
      search: [title, slug, parent]
    fields:
      - name: title
        label: カテゴリー名
        type: string
        required: true
      - name: slug
        label: URLスラッグ
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: 既存カテゴリーのURLを維持するため、公開済みカテゴリーでは変更しないでください。
      - name: parent
        label: 親カテゴリー
        type: reference
        required: false
        description: 親がない場合は空欄。親を選ぶと子カテゴリーとして管理されます。
        options:
          collection: categories
          multiple: false
          search: "title,fields.slug"
          value: "{fields.slug}"
          label: "{fields.title}"

  - name: tags
    label: タグ管理
    type: collection
    path: content/tag
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}/_index.md"
      field: false
    view:
      primary: title
      fields: [title, slug]
      search: [title, slug]
    fields:
      - name: title
        label: タグ名
        type: string
        required: true
      - name: slug
        label: URLスラッグ
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

  - name: reference-data
    label: 参照データ（自動生成）
    type: group
    items:
      - name: category-options
        label: 記事用カテゴリー一覧
        type: collection
        path: data/pages-cms/category-options
        format: yaml
        filename:
          template: "{fields.slug}.yml"
          field: false
        view:
          primary: hierarchy
          fields: [hierarchy, slug]
          search: [title, hierarchy, slug]
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: カテゴリー名
            type: string
          - name: slug
            label: スラッグ
            type: string
          - name: parent
            label: 親カテゴリー
            type: string
          - name: hierarchy
            label: 階層表示
            type: string

      - name: tag-options
        label: 記事用タグ一覧
        type: collection
        path: data/pages-cms/tag-options
        format: yaml
        filename:
          template: "{fields.slug}.yml"
          field: false
        view:
          primary: title
          fields: [title, slug]
          search: [title, slug]
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: タグ名
            type: string
          - name: slug
            label: スラッグ
            type: string

settings:
  content:
    merge: true
  commit:
    templates:
      create: "コンテンツを作成: {path}"
      update: "コンテンツを更新: {path}"
      delete: "コンテンツを削除: {path}"
      rename: "コンテンツ名を変更: {oldPath} -> {newPath}"
