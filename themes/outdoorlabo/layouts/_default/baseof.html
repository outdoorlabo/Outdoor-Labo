<!DOCTYPE html>
<html lang="ja">
<head>
  {{ with site.Params.gtmId }}
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','{{ . }}');</script>
  <!-- End Google Tag Manager -->
  {{ end }}
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}home{{ else }}{{ .Kind }}{{ end }}">
  {{ with site.Params.gtmId }}
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ . }}"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  {{ end }}
  <a class="skip-link" href="#main">コンテンツへスキップ</a>
  {{ partial "header.html" . }}
  <div class="wrap">
    <main id="main" class="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "sidebar.html" . }}
  </div>
  {{ partial "footer.html" . }}
  <a href="#" class="go-top" aria-label="ページの先頭へ" hidden>{{ partial "icon.html" "chevrons-up" }}</a>
  <script src="{{ "js/main.js" | relURL }}" defer></script>
</body>
</html>
