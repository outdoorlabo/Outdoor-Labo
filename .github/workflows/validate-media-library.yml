name: Validate Decap media library prototype

on:
  push:
    branches:
      - 'test/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check static/admin/media-library.js
