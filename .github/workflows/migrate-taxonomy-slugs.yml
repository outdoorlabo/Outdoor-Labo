name: Sync Pages CMS taxonomy references

on:
  push:
    branches:
      - feature/pages-cms-publishing
    paths:
      - "content/category/**"
      - "content/tag/**"
      - "scripts/sync-taxonomy-options.py"

permissions:
  contents: write

concurrency:
  group: taxonomy-reference-sync-feature-pages-cms-publishing
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/feature/pages-cms-publishing'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pages-cms-publishing
          fetch-depth: 0

      - name: Install YAML parser
        run: python3 -m pip install --user pyyaml

      - name: Generate flat reference collections
        run: python3 scripts/sync-taxonomy-options.py

      - name: Commit generated reference data
        run: |
          if [ -z "$(git status --porcelain -- data/pages-cms)" ]; then
            echo "Taxonomy reference data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pages-cms
          git commit -m "Sync Pages CMS taxonomy reference data"
          git push origin "HEAD:feature/pages-cms-publishing"
