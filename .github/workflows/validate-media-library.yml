name: Validate Decap CMS test configuration

on:
  push:
    branches:
      - 'test/**'
    paths:
      - 'static/admin/config.yml'
      - 'static/admin/media-library.js'
      - 'content/category/**'
      - 'scripts/validate-decap-taxonomy.py'
      - '.github/workflows/validate-media-library.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate Decap CMS configuration and category hierarchy
        run: python scripts/validate-decap-taxonomy.py
      - name: Check media library JavaScript syntax
        run: node --check static/admin/media-library.js
