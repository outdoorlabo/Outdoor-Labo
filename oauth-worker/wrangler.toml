# This branch is an isolated OAuth preview Worker.
# Never deploy this configuration to the production Worker.
name = "outdoorlabo-decap-auth-preview"
main = "src/index.ts"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
CMS_ORIGIN = "https://test-oauth-preview-origin-al.outdoorlabo.pages.dev"
CMS_ORIGINS = "https://test-oauth-preview-origin-al.outdoorlabo.pages.dev"

[secrets]
required = ["GITHUB_OAUTH_ID", "GITHUB_OAUTH_SECRET"]
