name: Validate Decap media library prototype

on:
  push:
    branches:
      - 'test/**'
    paths:
      - 'static/admin/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - 'test/**'
    paths:
      - 'static/admin/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check static/admin/media-library.js
      - name: Install YAML validator
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Validate Decap and workflow YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("static/admin/config.yml").read_text(encoding="utf-8"))
          workflow = yaml.load(Path(".github/workflows/organize-decap-media.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)

          assert config["backend"]["name"] == "github"
          assert config["backend"]["repo"] == "outdoorlabo/Outdoor-Labo"
          assert config["backend"]["branch"] == "test/oauth-preview-origin-allowlist"
          assert config["media_library"]["name"] == "outdoor-labo-folder-library"
          posts = next(c for c in config["collections"] if c["name"] == "posts")
          categories = next(c for c in config["collections"] if c["name"] == "categories")
          tags = next(c for c in config["collections"] if c["name"] == "tags")
          assert posts["media_folder"] == "static/wp-content/uploads/_incoming"
          assert posts["public_folder"] == "/wp-content/uploads/_incoming"
          for taxonomy in (categories, tags):
              assert taxonomy["extension"] == "md"
              assert taxonomy["format"] == "frontmatter"
              assert taxonomy["nested"]["depth"] >= 2
              assert taxonomy["meta"]["path"]["index_file"] == "_index"
          assert next(f for f in posts["fields"] if f["name"] == "category")["collection"] == "categories"
          assert next(f for f in posts["fields"] if f["name"] == "tag")["collection"] == "tags"
          assert "on" in workflow and "push" in workflow["on"]
          assert workflow["permissions"]["contents"] == "write"
          print("Decap config and media workflow YAML are valid.")
          PY
